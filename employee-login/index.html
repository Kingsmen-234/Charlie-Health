<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charlie Health Staff Login</title>
    <meta
      name="description"
      content="Charlie Health employee portal login for staff dashboard, direct deposit setup, training modules, and benefits overview."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="portal-page">
    <main class="portal-shell">
      <section class="login-card" aria-labelledby="login-title">
        <div class="portal-badge">EMPLOYEE PORTAL</div>
        <h1 id="login-title">Charlie Health Staff Login</h1>
        <p class="login-subtitle">
          Access your employee dashboard, direct deposit setup, training modules, and benefits overview.
        </p>

        <form data-login-form novalidate>
          <div class="field-group">
            <label for="employee-identifier">Work Email or Employee ID</label>
            <div class="input-wrap">
              <input
                id="employee-identifier"
                name="employeeIdentifier"
                type="text"
                placeholder="Enter your work email or employee ID"
                autocomplete="username"
                aria-label="Work Email or Employee ID"
                required
              />
            </div>
            <p class="error-message" id="employee-identifier-error" aria-live="polite"></p>
          </div>

          <div class="field-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                aria-label="Password"
                required
              />
              <button type="button" class="password-toggle" aria-label="Show password">Show</button>
            </div>
            <p class="error-message" id="password-error" aria-live="polite"></p>
          </div>

          <button type="submit" class="login-button">Log In to Employee Portal</button>

          <p class="auth-note">
            Demo login for local development: ilovemykingrudy@gmail.com / 1234567890. Connect your real employee authentication system before production deployment.
          </p>
        </form>
      </section>
    </main>

    <script src="../script.js"></script>
  </body>
</html>
